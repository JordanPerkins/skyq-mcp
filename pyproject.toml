[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "skyq-mcp"
version = "0.1.0.dev0"
description = "MCP server for controlling Sky Q boxes on your local network (unofficial)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jordan Perkins" }]
keywords = ["sky-q", "mcp", "remote-control", "raspberry-pi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Topic :: Home Automation",
]
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
    "uvicorn>=0.31.1",
    "websockets>=14",  # app status from the box (/as/apps/status)
    "zeroconf>=0.149.16",  # CVE-2026-47180/-47183/-47184/-48045/-48487: mDNS packets from the LAN
    # Security floors for packages that come in through mcp, whose own minimums allow
    # vulnerable versions (dependency audit 2026-11-25; see README "Security").
    "starlette>=1.3.1",
    "python-multipart>=0.0.31",
    "anyio>=4.14.2",
    "h11>=0.16",
    "pyjwt>=2.15.0",
    "cryptography>=50.0.0",
    "certifi>=2026.10.18",
]

[project.scripts]
skyq-mcp = "skyq_mcp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skyq_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
